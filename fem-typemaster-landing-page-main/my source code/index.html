<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="frontend Mentor challenge" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="grid-main ">
      <nav class="nav-flex">
        <a href="#">
          <img src="/assets/shared/logo.svg" alt="TypeMaster logo" width="40" />
        </a>
        <button class="button button-blue">Pre-order new</button>
      </nav>
    </header>
    <main>
      <section class="grid-main hero">
        <div class="hero-text">
          <h1 class="title">Typemaster keyboard</h1>
          <p class="info">
            Improve your productivity and gaming without breaking the bank.
            Upgrade to a high quality mechanical typing experience.
          </p>
 
          <button class="button button-orange">Pre-order new</button>
          <p class="release-date">
            <strong class="caps">Release on 5/27</strong>
          </p>
        </div>
        <div class="hero-image">
          <img
            src="/assets/desktop/image-keyboard.jpg"
            alt="mechanical keyboard"
            width="1080"
            height="960"
          />
        </div>

        <div class="grey-block"></div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
