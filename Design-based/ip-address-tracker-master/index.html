<body>
  <header>
    <section class="address grid-main">
      <h1>IP Address Tracker</h1>
      <div class="ip-section">
        <form action="#" autocomplete="on" class="js-form flex" >
          <input type="text" placeholder="  Search for any IP address or domain" class="js-input-element">
          <button aria-label="Submit"><img src="images/icon-arrow.svg" alt="arrow icon" class="js-submit-button"></button>
        </form>
      
          <div class="ip-address-details flex  " > 
            <div class="results  js-results" >
<!-- js-generated html -->
            </div>
          
        
        
        </div> 
      </div>
    </section>
  </header>
  <main class="grid-main">
  
    <section class="map">
      <div id="map"></div>
    </section>
  </main>
<!--
