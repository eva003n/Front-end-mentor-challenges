<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Interactive comments section</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <article class="comments-area">
      <!-- Comments area: pull dynamic content from the data.json file -->

      </article>
      <section class="comment-form rounded">
        <!-- Comment form is dynamically generated -->

      </section>
    </main>

    <!-- Delete confirmation modal -->

    <dialog id="customModal" class="modal rounded" closedby="any">
      <h2 id="modal-title">Delete comment</h2>
      <p>
        Are you sure you want to delete this comment? This will remove the
        comment and can't be undone.
      </p>
      <div class="modal-actions">
        <button type="button" class="btn-cancel rounded">No, cancel</button>
        <button type="button" class="btn-confirm rounded" >Yes, delete</button>
      </div>
    </dialog>

    <script src="index.js" type="module"></script>
  </body>
</html>
